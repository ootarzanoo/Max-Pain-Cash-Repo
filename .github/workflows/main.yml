name: Automated Market Scanner

on:
  schedule:
    - cron: '0 4 * * 1-5'    # Mon-Fri 09:30 AM IST (सुबह)
    - cron: '45 9 * * 1-5'   # Mon-Fri 03:15 PM IST (दोपहर)
  workflow_dispatch:         # मोबाइल से मैनुअल रन करने के लिए

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests
      - run: python script.py
